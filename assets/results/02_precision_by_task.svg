  <g id="text_9">
   <text style="fill: #17212b; font: 700 22px 'DejaVu Sans'; text-anchor: start" x="53.46" y="41.016563" transform="rotate(-0 53.46 41.016563)">Can the two comparison tests tell us which model leads?</text>
  </g>
  <g id="text_10">
   <text style="fill: #66717c; font: 13px 'DejaVu Sans'; text-anchor: start" x="53.46" y="56.7" transform="rotate(-0 53.46 56.7)">No. Every saved model-pair range overlaps within both accuracy tests.</text>
  </g>
  <g id="text_11">
   <text style="fill: #c44a3a; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="68.04" y="396.9" transform="rotate(-0 68.04 396.9)">Result: the saved marginal ranges do not resolve a leader.</text>
  </g>
  <g id="text_12">
   <text style="fill: #17212b; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="68.04" y="429.3" transform="rotate(-0 68.04 429.3)">Limit: these are not paired model-difference tests. Question-level results and cluster-aware uncertainty are unavailable.</text>
  </g>
  <g id="text_13">
   <text style="fill: #17212b; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="68.04" y="472.5" transform="rotate(-0 68.04 472.5)">Next: restore each answer and score, check scoring and labels, then compare models directly and run human review.</text>
  </g>
