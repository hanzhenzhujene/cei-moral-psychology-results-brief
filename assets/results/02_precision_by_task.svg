   <g id="text_30">
    <text style="fill: #66717c; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="110.693594" y="41.858875" transform="rotate(-0 110.693594 41.858875)">Each dot = one task median. Full panels: 8 MFQ and 10 vignette models. Saved ranges overlap for all 28 MFQ and 45 vignette model pairs.</text>
   </g>
   <g id="text_31">
    <text style="fill: #17212b; font: 700 20px 'DejaVu Sans'; text-anchor: start" x="110.693594" y="22.396875" transform="rotate(-0 110.693594 22.396875)">Saved ranges overlap for every model pair on both comparison tests</text>
   </g>
  </g>
  <g id="text_32">
   <text style="fill: #17212b; font: 700 9.7px 'DejaVu Sans'" transform="translate(20.173594 462.719216)">Decision: recover per-question outcomes, check scoring, compare models directly, and run human review.</text>
   <text style="fill: #17212b; font: 700 9.7px 'DejaVu Sans'" transform="translate(20.173594 473.656875)">Add independent items only if the order is still unclear.</text>
  </g>
  <g id="text_33">
   <text style="fill: #66717c; font: 9.1px 'DejaVu Sans'; text-anchor: start" x="20.173594" y="499.036875" transform="rotate(-0 20.173594 499.036875)">Narrow UniMoral intervals are nominal row-level precision; they do not establish construct validity or cluster-aware uncertainty.</text>
  </g>
 </g>
