    <text style="fill: #66717c; font: 11px 'DejaVu Sans'; text-anchor: start" x="110.693594" y="42.212975" transform="rotate(-0 110.693594 42.212975)">All 18 intervals wider than .30 occur in MoralBench compare; every within-task pair overlaps marginally.</text>
   </g>
   <g id="text_31">
    <text style="fill: #17212b; font: 700 10.2px 'DejaVu Sans'; text-anchor: start" x="110.693594" y="420.309155" transform="rotate(-0 110.693594 420.309155)">Decision: recover paired item outcomes first; if the order remains unresolved, expand the independent item banks.</text>
   </g>
   <g id="text_32">
    <text style="fill: #66717c; font: 9.3px 'DejaVu Sans'; text-anchor: start" x="110.693594" y="436.676955" transform="rotate(-0 110.693594 436.676955)">Narrow UniMoral intervals are nominal row-level precision; they do not establish construct validity or cluster-aware uncertainty.</text>
   </g>
   <g id="text_33">
    <text style="fill: #17212b; font: 700 20px 'DejaVu Sans'; text-anchor: start" x="110.693594" y="22.396875" transform="rotate(-0 110.693594 22.396875)">Available marginal intervals do not resolve a comparison-task model order</text>
   </g>
  </g>
 </g>
