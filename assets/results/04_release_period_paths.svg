  <g id="text_26">
   <text style="fill: #66717c; font: 9.6px 'DejaVu Sans'; text-anchor: start" x="55.44" y="701.28" transform="rotate(-0 55.44 701.28)">Exploratory: no saved intervals or raw-log replay. Release quarter is model metadata, not evaluation time; generation, route, architecture, and parameter count change together.</text>
