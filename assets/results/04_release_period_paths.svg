  <g id="text_25">
   <text style="fill: #66717c; font: 9.6px 'DejaVu Sans'; text-anchor: start" x="55.44" y="682.56" transform="rotate(-0 55.44 682.56)">Each point is one later-minus-earlier aggregate for the named model path above. † The saved intermediate DeepSeek path changes direction; see the full path figures for every checkpoint.</text>
